<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" type="image/png">
    <title>Tres en rasha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        background: '#f4f6f8',
                        surface: '#ffffff',
                        primary: '#1a1c29',
                        'player-x': '#ff597b',
                        'player-o': '#00bcd4',
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'inner-soft': 'inset 0 4px 6px -4px rgba(0, 0, 0, 0.05)',
                        'float': '0 20px 40px -5px rgba(0,0,0,0.1)',
                        'glow': '0 0 15px rgba(0,0,0,0.1)'
                    }
                },
            },
            plugins: [],
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body
    class="bg-background min-h-screen flex items-center justify-center p-4 text-primary antialiased selection:bg-gray-200">

    <main class="w-full max-w-md flex flex-col items-center">

        <section id="modo-selector"
            class="w-full bg-surface p-10 rounded-[2rem] shadow-soft text-center flex flex-col items-center gap-8 transition-all duration-500 transform hover:shadow-float">

            <header class="space-y-3">
                <div class="flex justify-center gap-4 mb-2 opacity-90">
                    <i class="fa-solid fa-x text-player-x text-3xl"></i>
                    <i class="fa-solid fa-o text-player-o text-3xl"></i>
                </div>
                <h1 class="text-5xl font-black tracking-tighter text-primary uppercase">TRES EN RASHA</h1>
                <p class="text-gray-400 font-semibold tracking-widest text-sm uppercase">Invencible </p>
            </header>

            <div class="flex flex-col w-full gap-4 mt-4">
                <button id="modo-2-jugadores"
                    class="group relative w-full flex items-center justify-center gap-3 px-6 py-4 bg-white border-2 border-gray-100 rounded-2xl shadow-sm hover:shadow-md transition-all hover:-translate-y-1 hover:border-player-x overflow-hidden">
                    <div
                        class="absolute inset-0 bg-player-x/5 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out">
                    </div>
                    <i
                        class="fa-solid fa-user-group text-gray-400 group-hover:text-player-x transition-colors relative z-10 text-lg"></i>
                    <span
                        class="font-bold text-gray-600 group-hover:text-primary transition-colors relative z-10 uppercase tracking-wide">Duelo
                        Local</span>
                </button>

                <button id="modo-vs-maquina"
                    class="group relative w-full flex items-center justify-center gap-3 px-6 py-4 bg-primary text-white rounded-2xl shadow-md hover:shadow-lg transition-all hover:-translate-y-1 hover:bg-gray-900 overflow-hidden">
                    <div
                        class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out">
                    </div>
                    <i class="fa-solid fa-robot text-player-o relative z-10 text-lg"></i>
                    <span class="font-bold tracking-widest relative z-10 uppercase">Desafiar maquina</span>
                </button>
            </div>
        </section>

        <section id="config-local"
            class="hidden w-full bg-surface p-8 rounded-[2rem] shadow-soft text-center flex flex-col items-center gap-6 transition-all duration-500 border border-gray-800/50">

            <header class="space-y-2">
                <h2 class="text-3xl font-black uppercase tracking-wider text-black drop-shadow-md">Personalizar</h2>
                <p class="text-gray-400 text-xs font-semibold tracking-widest uppercase">Elige tu avatar o usa los base
                </p>
            </header>

            <div class="flex gap-6 w-full justify-center mt-2">
                <div class="flex flex-col items-center gap-3">
                    <span class="text-player-x font-black text-xs tracking-[0.2em] uppercase">Jugador 1</span>
                    <label for="upload-x"
                        class="w-24 h-24 rounded-2xl border-2 border-dashed border-gray-600 hover:border-player-x flex items-center justify-center cursor-pointer relative overflow-hidden group transition-colors shadow-inner-soft">
                        <img id="preview-x" src="images/yo.png"
                            class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-30 transition-opacity">
                        <i
                            class="fa-solid fa-camera text-2xl text-white relative z-10 drop-shadow-md group-hover:scale-110 transition-transform"></i>
                        <input type="file" id="upload-x" accept="image/*" class="hidden">
                    </label>
                </div>

                <div class="flex flex-col items-center gap-3">
                    <span class="text-player-o font-black text-xs tracking-[0.2em] uppercase">Jugador 2</span>
                    <label for="upload-o"
                        class="w-24 h-24 rounded-2xl border-2 border-dashed border-gray-600 hover:border-player-o flex items-center justify-center cursor-pointer relative overflow-hidden group transition-colors shadow-inner-soft">
                        <img id="preview-o" src="images/ia.png"
                            class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-30 transition-opacity">
                        <i
                            class="fa-solid fa-camera text-2xl text-white relative z-10 drop-shadow-md group-hover:scale-110 transition-transform"></i>
                        <input type="file" id="upload-o" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <div class="flex flex-col w-full gap-3 mt-4">
                <button id="iniciar-duelo-btn"
                    class="w-full py-4 bg-player-x text-white rounded-2xl shadow-float hover:shadow-lg hover:-translate-y-1 transition-all font-bold tracking-widest uppercase text-sm">
                    <i class="fa-solid fa-fire mr-2"></i> Iniciar Batalla
                </button>
                <button id="volver-menu-config"
                    class="text-gray-500 hover:text-gray-300 text-xs font-bold uppercase tracking-wider py-2 transition-colors">
                    Atrás
                </button>
            </div>
        </section>

        <section id="juego-contenedor" class="hidden w-full flex flex-col items-center gap-6">

            <header id="marcador"
                class="w-full flex justify-between items-center bg-surface p-5 rounded-3xl shadow-soft">
                <div class="flex flex-col items-center w-1/3">
                    <span class="text-xs font-bold text-gray-400 tracking-[0.2em] mb-1">JUGADOR 1</span>
                    <span id="score-x" class="text-4xl font-black text-player-x drop-shadow-sm">0</span>
                </div>

                <div class="flex flex-col items-center w-1/3 border-x-2 border-gray-50">
                    <span class="text-sm font-black text-gray-300">VS</span>
                </div>

                <div class="flex flex-col items-center w-1/3">
                    <span class="text-xs font-bold text-gray-400 tracking-[0.2em] mb-1">MÁQUINA</span>
                    <span id="score-o" class="text-4xl font-black text-player-o drop-shadow-sm">0</span>
                </div>
            </header>

            <div class="h-14 w-full flex items-center justify-center text-center">
                <div id="indicador-turno"
                    class="text-gray-500 font-medium text-lg px-6 py-2 bg-white rounded-full shadow-sm border border-gray-100 transition-all">
                    Turno de: <span id="turno-actual" class="text-player-x font-bold">X</span>
                </div>
                <div id="mensaje-resultado"
                    class="hidden text-3xl sm:text-4xl font-black uppercase tracking-[0.15em] drop-shadow-md animate-fade-in w-full">
                </div>
            </div>

            <div id="tablero"
                class="grid grid-cols-3 gap-3 p-4 bg-gray-100/80 rounded-[2rem] shadow-inner-soft backdrop-blur-sm transition-all duration-500 w-full aspect-square border border-gray-200/50">
                <div id="c0" class="celda"></div>
                <div id="c1" class="celda"></div>
                <div id="c2" class="celda"></div>
                <div id="c3" class="celda"></div>
                <div id="c4" class="celda"></div>
                <div id="c5" class="celda"></div>
                <div id="c6" class="celda"></div>
                <div id="c7" class="celda"></div>
                <div id="c8" class="celda"></div>
            </div>

            <footer class="flex flex-col w-full gap-3 mt-2">
                <button id="reiniciar"
                    class="hidden w-full py-4 bg-primary text-white rounded-2xl shadow-float hover:shadow-lg hover:-translate-y-1 transition-all font-bold tracking-widest uppercase text-sm flex items-center justify-center gap-3 border border-gray-800">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> Siguiente Batalla
                </button>

                <div class="flex gap-3 w-full">
                    <button id="reset-score"
                        class="hidden flex-1 py-3 bg-surface border border-gray-200 text-gray-500 hover:text-primary hover:border-gray-300 rounded-xl shadow-sm transition-all text-xs font-bold uppercase tracking-wider flex justify-center items-center gap-2">
                        <i class="fa-solid fa-arrows-rotate"></i> Resetear
                    </button>

                    <button id="volver-menu"
                        class="hidden flex-1 py-3 bg-surface border border-gray-200 text-gray-500 hover:text-player-x hover:border-player-x/30 rounded-xl shadow-sm transition-all text-xs font-bold uppercase tracking-wider flex justify-center items-center gap-2">
                        <i class="fa-solid fa-power-off"></i> Salir
                    </button>
                </div>
            </footer>

        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
